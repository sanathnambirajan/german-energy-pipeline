energy:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5433') | int }}"
      dbname: "{{ env_var('DB_NAME', 'energy') }}"
      user: "{{ env_var('DB_USER', 'energy') }}"
      password: "{{ env_var('DB_PASSWORD', 'energy') }}"
      schema: analytics
      threads: 4
